[package]
name = "winsla-service"
version = "2.0.7"
edition = "2021"
authors = ["ylw"]
description = "Windows Service for dual-account authentication bridge"

[[bin]]
name = "winsla-service"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
tokio.workspace = true
windows-service.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
env_logger.workspace = true
chrono.workspace = true
uuid.workspace = true
sha2.workspace = true

# SQLite audit storage (shared with management app)
rusqlite = { version = "0.32", features = ["bundled"] }

[build-dependencies]
winres = "0.1"

[package]
name = "winsla-management"
version = "2.2.1"
edition = "2021"
description = "WinSLA Dual-Account Authentication Management App"
authors = ["ylw"]

[lib]
name = "winsla_management_lib"
path = "lib.rs"
crate-type = ["lib"]

[[bin]]
name = "winsla-management"
path = "main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
env_logger.workspace = true
tokio.workspace = true
windows.workspace = true

# SQLite storage
rusqlite = { version = "0.32", features = ["bundled"] }

# Web server
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }

# Embedded frontend assets
rust-embed = "8"
mime_guess = "2"

# WebView2 native window
wry = "0.50"
tao = "0.31"

[build-dependencies]
embed-resource = "2.4"

[package]
name = "winsla-management"
version = "0.1.0"
edition = "2021"
description = "WinSLA Dual-Account Authentication Management App"
authors = ["WinSLA Team"]

[lib]
name = "winsla_management_lib"
path = "lib.rs"
crate-type = ["lib"]

[[bin]]
name = "winsla-management"
path = "main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
env_logger.workspace = true

# SQLite storage
rusqlite = { version = "0.32", features = ["bundled"] }

[build-dependencies]
winres = "0.1"
